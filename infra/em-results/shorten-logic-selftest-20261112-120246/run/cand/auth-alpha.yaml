auth:
  - name: alice
    loginEndpointAuth:
      payloadUserPwd:
        username: alice
        password: "alicepass"
        usernameField: username
        passwordField: password
  - name: boss
    loginEndpointAuth:
      payloadUserPwd:
        username: boss
        password: "bosspass"
        usernameField: username
        passwordField: password
  - name: bob
    loginEndpointAuth:
      payloadUserPwd:
        username: bob
        password: "bobpass"
        usernameField: username
        passwordField: password
authTemplate:
  loginEndpointAuth:
    endpoint: /auth/login
    verb: POST
    contentType: application/json
    token:
      extractFrom: body
      extractSelector: /token
      sendIn: header
      sendName: Authorization
      sendTemplate: "Bearer {token}"
