server:
  port: 8080

app:
  security:
    stateful-role-check: false     # false = VULNERABLE (default). true = PATCHED.
  jwt:
    secret: "dev-only-change-me-please-32bytes-min"   # HS256 secret; override via APP_JWT_SECRET
    ttl-seconds: 3600                                   # 1h so tokens outlive a fuzz run

springdoc:
  api-docs:
    path: /v3/api-docs
