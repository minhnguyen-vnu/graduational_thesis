authTemplate:
  loginEndpointAuth:
    externalEndpointURL: http://localhost:3000/v1/auth/operator/login
    verb: POST
    contentType: application/json
    token:
      extractFrom: body
      extractSelector: /accessToken
      sendIn: header
      sendName: Authorization
      sendTemplate: "Bearer {token}"
