# EvoMaster black-box auth config for the fastschema held-out target (WFC format, jar P2e).
#
# fastschema authenticates with a JWT bearer carrying user.role_ids (C-JWT).
# Login: POST /api/auth/local/login  body {login,password}  -> JSON data.token.
# externalEndpointURL points at the capture proxy (:8212) so logins are recorded.
# File order = [low, operator, victim]; RestSampler processes the LAST entry first, so the
# A1 victim is reached first, operator (admin, performs the demotion) second.
#
# Accounts are seeded by infra/em-results/fastschema-heldout-20261014/reseed.sh
# (setup user 'admin' = Admin/root; bootstrap 'victim' = Admin, 'plain' = User).

auth:
  - name: low             # User role, negative control
    loginEndpointAuth:
      payloadRaw: '{"login":"plain","password":"PlainPass123"}'
  - name: operator        # Admin/root, performs PUT /api/content/user demotion
    loginEndpointAuth:
      payloadRaw: '{"login":"admin","password":"AdminPass123"}'
  - name: victim          # Admin, the A1 demotion victim
    loginEndpointAuth:
      payloadRaw: '{"login":"victim","password":"VictimPass123"}'

authTemplate:
  loginEndpointAuth:
    externalEndpointURL: http://localhost:8212/api/auth/local/login
    verb: POST
    contentType: application/json
    token:
      extractFrom: body
      extractSelector: /data/token
      sendIn: header
      sendName: Authorization
      sendTemplate: "Bearer {token}"
