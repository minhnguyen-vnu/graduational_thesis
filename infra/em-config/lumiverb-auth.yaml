auth:
  - name: viewer
    loginEndpointAuth:
      payloadRaw: '{"email":"viewer@thesis.test","password":"Thesis-Pass-1234"}'
  - name: operator
    loginEndpointAuth:
      payloadRaw: '{"email":"operator@thesis.test","password":"Thesis-Pass-1234"}'
  - name: victim
    loginEndpointAuth:
      payloadRaw: '{"email":"victim@thesis.test","password":"Thesis-Pass-1234"}'
authTemplate:
  loginEndpointAuth:
    externalEndpointURL: http://127.0.0.1:8000/v1/auth/login
    verb: POST
    contentType: application/json
    token:
      extractFrom: body
      extractSelector: /access_token
      sendIn: header
      sendName: Authorization
      sendTemplate: "Bearer {token}"
