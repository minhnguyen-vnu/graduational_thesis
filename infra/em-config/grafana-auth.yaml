auth:
  - name: victim
    loginEndpointAuth:
      payloadUserPwd:
        username: victim
        password: "victimpass"
        usernameField: user
        passwordField: password
  - name: admin
    loginEndpointAuth:
      payloadUserPwd:
        username: admin
        password: "adminpass"
        usernameField: user
        passwordField: password
  - name: viewer
    loginEndpointAuth:
      payloadUserPwd:
        username: viewer
        password: "viewerpass"
        usernameField: user
        passwordField: password

authTemplate:
  loginEndpointAuth:
    endpoint: /login
    verb: POST
    contentType: application/json
    expectCookies: true
